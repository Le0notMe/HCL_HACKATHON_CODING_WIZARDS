services:
  mysql:
    image: mysql:8.4
    container_name: ticket-assistant-mysql
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ticket_assistant
      MYSQL_USER: ticket_app
      MYSQL_PASSWORD: ticket_app
      MYSQL_ROOT_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uticket_app", "-pticket_app"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
